name: l10n-export
on:
  push:
    branches: [main]
    paths: ["**/Localizable.xcstrings"]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l10n
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - name: Fetch tools submodule
        run: |
          git config --global url."https://x-access-token:${{ secrets.TOOLS_PAT }}@github.com/".insteadOf "git@github.com:"
          git submodule update --init tools
      - name: Sync catalog from main and export
        run: |
          git checkout origin/main -- Cork/Localizable.xcstrings
          python3 tools/Localization/xcstrings_export.py Cork/Localizable.xcstrings xliff
      - name: Push to l10n branch
        run: |
          git config user.name "l10n-bot"
          git config user.email "bot@users.noreply.github.com"
          git add xliff Cork/Localizable.xcstrings
          git diff --cached --quiet || git commit -m "Sync XLIFF from string catalog"
          git push origin l10n

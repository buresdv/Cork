name: l10n-export
on:
  push:
    branches: [main]
    paths: ["**/Localizable.xcstrings"]
permissions:
  contents: write
  pull-requests: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - name: Fetch tools submodule
        run: |
          git config --global url."https://x-access-token:${{ secrets.TOOLS_PAT }}@github.com/".insteadOf "git@github.com:"
          git submodule update --init tools
      - run: python3 tools/Localization/xcstrings_export.py Cork/Localizable.xcstrings xliff
      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          title: "Sync XLIFF from string catalog"
          commit-message: "Sync XLIFF from string catalog"
          branch: l10n/export
          delete-branch: true
          add-paths: xliff
          labels: l10n
      - name: Enable auto-merge
        run: gh pr merge --auto --squash l10n/export || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: l10n-import
on:
  push:
    branches: [main]
    paths: ['xliff/**']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Fetch tools submodule
        run: |
          git config url."https://x-access-token:${{ secrets.TOOLS_PAT }}@github.com/".insteadOf "git@github.com:"
          git submodule update --init tools
      - run: python3 tools/Localization/xcstrings_import.py Cork/Localizable.xcstrings xliff
      - name: Commit catalog
        run: |
          git config user.name "l10n-bot"
          git config user.email "bot@users.noreply.github.com"
          git add Cork/Localizable.xcstrings
          git diff --cached --quiet || git commit -m "Merge translations into string catalog"
          git push

name: l10n-import
on:
  push:
    branches: [l10n]
    paths: ["json/**"]
permissions:
  contents: write
  pull-requests: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - name: Fetch "tools" submodule
        run: |
          git config --global url."https://x-access-token:${{ secrets.TOOLS_PAT }}@github.com/".insteadOf "git@github.com:"
          git submodule update --init tools
      - name: Take JSON and catalog from l10n & merge
        run: |
          git checkout origin/l10n -- json Cork/Localizable.xcstrings
          python3 tools/Localization/xcstrings_import.py Cork/Localizable.xcstrings json
      - name: Validate catalog against xcstrings schema
        run: |
          pip install jsonschema
          curl -sSL -o /tmp/xcstrings.schema.json \
            https://raw.githubusercontent.com/buresdv/xcstrings.schema.json/refs/tags/v1.0.0/xcstrings.schema.json
          python3 - <<'EOF'
          import json
          import jsonschema
          schema = json.load(open("/tmp/xcstrings.schema.json"))
          catalog = json.load(open("Cork/Localizable.xcstrings"))
          jsonschema.validate(catalog, schema)
          print("Localizable.xcstrings matches the schema")
          EOF
      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          title: "Merge translations into string catalog"
          commit-message: "Merge translations into string catalog"
          branch: l10n-import
          base: main
          delete-branch: true
          add-paths: Cork/Localizable.xcstrings
          labels: l10n
      - name: Enable auto-merge
        run: gh pr merge --auto --squash l10n-import || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

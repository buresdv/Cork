name: l10n-import
on:
  push:
    branches: [main]
    paths: ["xliff/**"]
permissions:
  contents: write
  pull-requests: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - name: Fetch tools submodule
        run: |
          git config --global url."https://x-access-token:${{ secrets.TOOLS_PAT }}@github.com/".insteadOf "git@github.com:"
          git submodule update --init tools
      - run: python3 tools/Localization/xcstrings_import.py Cork/Localizable.xcstrings xliff
      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          title: "Merge translations into string catalog"
          commit-message: "Merge translations into string catalog"
          branch: l10n/import
          delete-branch: true
          add-paths: Cork/Localizable.xcstrings
          labels: l10n
      - name: Enable auto-merge
        run: gh pr merge --auto --squash l10n/import || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
